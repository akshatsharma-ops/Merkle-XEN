  <div class="shell">

    <!-- ==========================================================
         LOGO — this is a stand-in lockup drawn to match the brand.

         ========================================================== -->
    <header class="bar">
      <a class="bar__logo" href="./" aria-label="Merkle XEN — home">
        <svg viewBox="0 0 330 152" role="img" aria-hidden="true">
          <text class="bar__logo-sup" x="56" y="34">MERKLE</text>
